<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>rosy ✦ zyy · Merry Christmas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 48%, #160526 0%, #090212 58%, #020005 100%);
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }

    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      cursor: grab;
    }

    #canvas:active {
      cursor: grabbing;
    }

    /* -------------------------------------------------------------
     * 终幕专属文字层：仅保留 rosy、zyy 与 Merry Christmas / 圣诞快乐
     * 选用高定经典衬线体，字形挺拔清晰、绝对一眼可辨
     * ------------------------------------------------------------- */
    .title-layer {
      position: absolute;
      left: 5.5%;
      top: 46%;
      transform: translateY(-50%);
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.8s ease;
    }

    .title-layer.visible {
      opacity: 1;
    }

    .names-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }

    .name-text {
      /* 清晰优雅的经典衬线字体，字母结构分明不连笔 */
      font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif;
      font-size: 52px;
      font-weight: 600;
      letter-spacing: 3.5px;
      line-height: 1.05;
      background: linear-gradient(135deg, #ffffff 0%, #fbcfe8 38%, #f472b6 72%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(244, 114, 182, 0.48));
    }

    .star-divider {
      font-size: 20px;
      color: #e9d5ff;
      text-shadow: 0 0 10px rgba(216, 180, 254, 0.85), 0 0 20px rgba(244, 114, 182, 0.65);
      animation: starPulse 2.4s ease-in-out infinite;
    }

    .greeting-en {
      font-family: "Palatino Linotype", Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-style: italic;
      font-weight: 400;
      letter-spacing: 1.5px;
      color: #fdf4ff;
      text-shadow: 0 0 14px rgba(216, 180, 254, 0.6);
      margin-bottom: 8px;
    }

    .greeting-zh {
      font-family: "Songti SC", "Noto Serif SC", "SimSun", "PingFang SC", "Microsoft YaHei", serif;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 8px;
      color: rgba(251, 207, 232, 0.92);
      text-shadow: 0 0 12px rgba(244, 114, 182, 0.5);
    }

    @keyframes starPulse {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.82; }
      50% { transform: scale(1.22) rotate(45deg); opacity: 1; }
    }

    /* -------------------------------------------------------------
     * 幕间过场诗意字幕：随动画自然淡入淡出，串联五幕故事
     * ------------------------------------------------------------- */
    .story-caption {
      position: absolute;
      left: 50%;
      bottom: 6.5%;
      transform: translate(-50%, 10px);
      z-index: 12;
      pointer-events: none;
      width: min(88vw, 820px);
      text-align: center;
      font-family: "Songti SC", "Noto Serif SC", "PingFang SC", "Microsoft YaHei", serif;
      font-size: 16.5px;
      letter-spacing: 2.2px;
      line-height: 1.75;
      color: rgba(250, 232, 255, 0.9);
      text-shadow: 0 0 14px rgba(192, 132, 252, 0.55), 0 2px 10px rgba(0, 0, 0, 0.9);
      opacity: 0;
      transition: opacity 1.1s ease, transform 1.1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .story-caption.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* -------------------------------------------------------------
     * 无文字纯图标控制栏
     * ------------------------------------------------------------- */
    .hud-controls {
      position: absolute;
      top: 24px;
      right: 26px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .stage-dots {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(216, 180, 254, 0.16);
      backdrop-filter: blur(8px);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(243, 232, 255, 0.28);
      cursor: pointer;
      transition: all 0.35s ease;
    }

    .dot:hover {
      background: rgba(244, 114, 182, 0.75);
      transform: scale(1.25);
    }

    .dot.active {
      width: 18px;
      border-radius: 4px;
      background: linear-gradient(90deg, #f472b6, #c084fc);
      box-shadow: 0 0 10px rgba(244, 114, 182, 0.75);
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(216, 180, 254, 0.24);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      color: #f5d0fe;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }

    .icon-btn:hover {
      border-color: rgba(244, 114, 182, 0.75);
      background: rgba(244, 114, 182, 0.2);
      box-shadow: 0 0 14px rgba(244, 114, 182, 0.4);
    }

    .icon-btn.active {
      border-color: #f472b6;
      background: rgba(236, 72, 153, 0.38);
      box-shadow: 0 0 16px rgba(244, 114, 182, 0.65);
    }

    @media (max-width: 900px) {
      .title-layer {
        left: 22px;
        top: 22px;
        transform: none;
      }
      .names-row { gap: 10px; margin-bottom: 6px; }
      .name-text { font-size: 34px; letter-spacing: 2px; }
      .star-divider { font-size: 16px; }
      .greeting-en { font-size: 18px; margin-bottom: 4px; }
      .greeting-zh { font-size: 14px; letter-spacing: 5px; }
      .story-caption { font-size: 13.5px; letter-spacing: 1.2px; bottom: 5%; }
      .hud-controls { top: 22px; right: 18px; gap: 8px; }
    }
  </style>
</head>

    const STAGE_CAPTIONS = [
      '当岁末的夜空落满星光，有一份祝愿正在为你汇聚。',
      '愿你如这束炽热的火把，永远明媚自由，奔赴属于自己的光芒。',
      '哪怕山海层叠、流水绵长，也总有一阵温柔的风，吹散这一年的疲惫。',
      '同是江西故人，此刻我在河北，你在江西；隔山隔水，却隔不断这份跨越南北的惦念。',
      '山河远阔，灯火可亲。把这片独一无二的紫粉星光送给你——'
    ];

    const STAGE_DURATIONS = [3.2, 5.5, 6.0, 7.5, Infinity];

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const titleLayer = document.getElementById('titleLayer');
    const storyCaption = document.getElementById('storyCaption');
    const stageDots = document.querySelectorAll('#stageDots .dot');

    let width = 0;
    let height = 0;
    let dpr = 1;

    // -------------------------------------------------------------
    // 1. 预渲染超精细微粒精灵贴图 (8 种专色)
    // -------------------------------------------------------------
    const sprites = [];
    const PALETTE = [
      { core: '#ffffff', halo: '#d8b4fe' }, // 0: 薰衣草紫
      { core: '#ffffff', halo: '#f9a8d4' }, // 1: 樱花粉
      { core: '#ffffff', halo: '#a855f7' }, // 2: 霓虹亮紫
      { core: '#ffffff', halo: '#ec4899' }, // 3: 玫瑰亮粉
      { core: '#ffffff', halo: '#e9d5ff' }, // 4: 冰晶星白
      { core: '#fffbeb', halo: '#fbbf24' }, // 5: 炽热香槟金
      { core: '#fff1f2', halo: '#fb7185' }, // 6: 火把炽红粉
      { core: '#f0f9ff', halo: '#7dd3fc' }  // 7: 冰川流水蓝
    ];

    function buildSprites() {
      PALETTE.forEach((c) => {
        const off = document.createElement('canvas');
        off.width = 32;
        off.height = 32;
        const octx = off.getContext('2d');
        const grad = octx.createRadialGradient(16, 16, 0, 16, 16, 16);
        grad.addColorStop(0, c.core);
        grad.addColorStop(0.22, c.core);
        grad.addColorStop(0.45, c.halo);
        grad.addColorStop(0.75, c.halo + '33');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        octx.fillStyle = grad;
        octx.fillRect(0, 0, 32, 32);
        sprites.push(off);
      });
    }
    buildSprites();

    // -------------------------------------------------------------
    // 2. 7500 颗粒子池
    // -------------------------------------------------------------
    const PARTICLE_COUNT = 7500;
    const particles = [];

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push({
        x: (Math.random() - 0.5) * 1400,
        y: (Math.random() - 0.5) * 900,
        z: (Math.random() - 0.5) * 800,
        vx: 0, vy: 0, vz: 0,
        tx: 0, ty: 0, tz: 0,
        size: 1.5, targetSize: 1.5,
        alpha: 0.8, targetAlpha: 0.8,
        spriteIdx: i % 5,
        targetSpriteIdx: i % 5,
        phase: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.02 + Math.random() * 0.04,
        role: 'static',
        seed: Math.random(),
        orbitR: 0, orbitTheta: 0, orbitSpeed: 0, baseY: 0,
        flamePhase: Math.random(), flameSpeed: 0.012 + Math.random() * 0.016,
        flameMaxR: 0, flameBaseY: 0, flameSeedX: Math.random() * 6.28,
        flowT: Math.random(), flowSpeed: 0.003 + Math.random() * 0.003, flowOffset: 0,
        arcHalfW: 160, arcBaseY: 0, arcLift: 90
      });
    }

    // -------------------------------------------------------------
    // 3. 几何与汉字采样工具函数
    // -------------------------------------------------------------
    function pointInRings(x, y, rings) {
      let inside = false;
      for (let r = 0; r < rings.length; r++) {
        const poly = rings[r];
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          const xi = poly[i][0], yi = poly[i][1];
          const xj = poly[j][0], yj = poly[j][1];
          const intersect = ((yi > y) !== (yj > y)) &&
            (x < (xj - xi) * (y - yi) / (yj - yi + 1e-9) + xi);
          if (intersect) inside = !inside;
        }
      }
      return inside;
    }

    function samplePerimeter(rings, count) {
      const segs = [];
      let totalLen = 0;
      for (let r = 0; r < rings.length; r++) {
        const poly = rings[r];
        for (let i = 0; i < poly.length; i++) {
          const p1 = poly[i];
          const p2 = poly[(i + 1) % poly.length];
          const dx = p2[0] - p1[0];
          const dy = p2[1] - p1[1];
          const len = Math.hypot(dx, dy);
          if (len > 0) {
            segs.push({ x1: p1[0], y1: p1[1], dx, dy, len, acc: totalLen });
            totalLen += len;
          }
        }
      }
      const pts = [];
      for (let k = 0; k < count; k++) {
        const d = (k / count) * totalLen;
        let lo = 0, hi = segs.length - 1;
        while (lo < hi) {
          const mid = (lo + hi + 1) >> 1;
          if (segs[mid].acc <= d) lo = mid; else hi = mid - 1;
        }
        const s = segs[lo];
        const t = (d - s.acc) / s.len;
        pts.push([s.x1 + s.dx * t, s.y1 + s.dy * t]);
      }
      return pts;
    }

    function sampleInterior(rings, count) {
      const pts = [];
      let attempts = 0;
      while (pts.length < count && attempts < count * 25) {
        attempts++;
        const rx = Math.random() * 1.8 - 0.9;
        const ry = Math.random() * 2.0 - 1.0;
        if (pointInRings(rx, ry, rings)) {
          pts.push([rx, ry]);
        }
      }
      return pts;
    }

    function sampleChineseText(text, targetCount) {
      const off = document.createElement('canvas');
      off.width = 280;
      off.height = 110;
      const octx = off.getContext('2d');
      octx.fillStyle = '#000';
      octx.fillRect(0, 0, off.width, off.height);
      octx.fillStyle = '#fff';
      octx.font = 'bold 74px "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Heiti SC", sans-serif';
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.fillText(text, off.width / 2, off.height / 2);

      const img = octx.getImageData(0, 0, off.width, off.height).data;
      const raw = [];
      let minX = off.width, maxX = 0, minY = off.height, maxY = 0;

      for (let y = 0; y < off.height; y += 2) {
        for (let x = 0; x < off.width; x += 2) {
          const alpha = img[(y * off.width + x) * 4];
          if (alpha > 110) {
            raw.push([x, y]);
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      const out = [];
      if (raw.length === 0) return out;

      for (let i = 0; i < targetCount; i++) {
        const pt = raw[Math.floor((i / targetCount) * raw.length)];
        out.push([
          pt[0] - cx + (Math.random() - 0.5) * 1.3,
          pt[1] - cy + (Math.random() - 0.5) * 1.3
        ]);
      }
      return out;
    }

    let cachedGeo = null;
    function ensureGeoCache() {
      if (cachedGeo) return cachedGeo;
      const hbOutline = samplePerimeter(PROVINCE_DATA.hebei, 1250);
      const hbFill = sampleInterior(PROVINCE_DATA.hebei, 950);
      const jxOutline = samplePerimeter(PROVINCE_DATA.jiangxi, 1250);
      const jxFill = sampleInterior(PROVINCE_DATA.jiangxi, 950);
      const hbText = sampleChineseText('河北', 820);
      const jxText = sampleChineseText('江西', 820);
      cachedGeo = { hbOutline, hbFill, jxOutline, jxFill, hbText, jxText };
      return cachedGeo;
    }

    // -------------------------------------------------------------
    // 4. 字幕控制与五幕场景构建
    // -------------------------------------------------------------
    let currentStage = 0;
    let stageElapsed = 0;
    let scatterTimer = 0;
    let captionTimer = null;

    let rotY = 0;
    let rotX = 0.14;
    let targetRotY = 0;
    let targetRotX = 0.14;
    let zoom = 1.0;
    let targetZoom = 1.0;
    let isDragging = false;
    let lastX = 0;
    let lastY = 0;

    function updateCaption(stageIndex, withScatter) {
      if (captionTimer) {
        clearTimeout(captionTimer);
        captionTimer = null;
      }
      // 转场爆散时先淡出上一句
      storyCaption.classList.remove('show');
      const delay = withScatter ? 620 : 120;

      captionTimer = setTimeout(() => {
        storyCaption.textContent = STAGE_CAPTIONS[stageIndex];
        storyCaption.classList.add('show');

        // 第 5 幕的衔接语展示 3.4 秒后柔和隐退，保持终幕圣诞树与双语祝福极度纯净
        if (stageIndex === 4) {
          captionTimer = setTimeout(() => {
            storyCaption.classList.remove('show');
          }, 3400);
        }
      }, delay);
    }

    function configureStage(stageIndex, withScatter = true) {
      currentStage = stageIndex;
      stageElapsed = 0;
      scatterTimer = withScatter ? 0.72 : 0;

      stageDots.forEach((d, idx) => d.classList.toggle('active', idx === stageIndex));
      updateCaption(stageIndex, withScatter);

      // 终幕才点亮 rosy ✦ zyy 与 Merry Christmas / 圣诞快乐
      if (stageIndex === 4) {
        titleLayer.classList.add('visible');
      } else {
        titleLayer.classList.remove('visible');
      }

      if (withScatter) {
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const p = particles[i];
          const len = Math.hypot(p.x, p.y, p.z) || 1;
          const burst = 7 + Math.random() * 14;
          p.vx = (p.x / len) * burst + (Math.random() - 0.5) * 10;
          p.vy = (p.y / len) * burst + (Math.random() - 0.5) * 10;
          p.vz = (p.z / len) * burst + (Math.random() - 0.5) * 10;
        }
      }

      const minDim = Math.min(width, height);

      // 第 1 幕：漫天繁星
      if (stageIndex === 0) {
        targetRotX = 0.08;
        targetZoom = 1.0;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const p = particles[i];
          p.role = 'star';
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          const dist = 160 + Math.random() * Math.max(width, height) * 0.72;
          p.tx = Math.sin(phi) * Math.cos(theta) * dist;
          p.ty = Math.cos(phi) * dist * 0.68;
          p.tz = Math.sin(phi) * Math.sin(theta) * dist;
          p.orbitR = Math.hypot(p.tx, p.tz);
          p.orbitTheta = Math.atan2(p.tz, p.tx);
          p.orbitSpeed = 0.0005 + Math.random() * 0.001;
          p.baseY = p.ty;

          const r = Math.random();
          p.targetSpriteIdx = r < 0.45 ? 4 : (r < 0.75 ? 0 : (r < 0.94 ? 1 : 5));
          p.targetSize = r > 0.96 ? 2.8 : (0.9 + Math.random() * 1.4);
          p.targetAlpha = 0.35 + Math.random() * 0.6;
        }
      }

      // 第 2 幕：聚成火把
      else if (stageIndex === 1) {
        targetRotX = 0.1;
        targetZoom = 1.0;
        const torchH = Math.min(height * 0.64, 540);
        const bowlY = -torchH * 0.06;
        const handleTop = bowlY + 12;
        const handleBot = torchH * 0.44;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const p = particles[i];
          if (i < 2600) {
            p.role = 'orbit';
            const t = i / 2600;
            let radius, y;
            if (t < 0.28) {
              const bt = t / 0.28;
              radius = (1 - Math.pow(bt, 0.75) * 0.58) * (minDim * 0.095);
              y = bowlY - 12 + bt * 52;
            } else {
              const ht = (t - 0.28) / 0.72;
              radius = (1 - ht * 0.62) * (minDim * 0.04) * (1 + 0.08 * Math.sin(ht * 24));
              y = handleTop + 40 + ht * (handleBot - handleTop - 40);
            }
            const theta = i * 2.39996;
            const rJitter = radius * (t < 0.18 ? (0.85 + 0.15 * Math.random()) : (0.72 + 0.28 * Math.random()));
            p.orbitR = rJitter;
            p.orbitTheta = theta;
            p.orbitSpeed = 0.008;
            p.baseY = y;
            p.tx = Math.cos(theta) * rJitter;
            p.ty = y;
            p.tz = Math.sin(theta) * rJitter;

            p.targetSpriteIdx = t < 0.28 ? (Math.random() < 0.5 ? 5 : 1) : (Math.random() < 0.6 ? 2 : 0);
            p.targetSize = 1.3 + Math.random() * 1.4;
            p.targetAlpha = 0.82;
          } else {
            p.role = 'flame';
            p.flamePhase = Math.random();
            p.flameSpeed = 0.008 + Math.random() * 0.014;
            p.flameBaseY = bowlY;
            p.flameMaxR = minDim * 0.105;
            p.flameSeedX = Math.random() * Math.PI * 2;
            p.orbitTheta = Math.random() * Math.PI * 2;

            const isSpark = i > 7050;
            p.seed = isSpark ? 1 : 0;
            const f = p.flamePhase;
            const envR = Math.sin(f * Math.PI) * (1 - f * 0.55) * p.flameMaxR;
            const r = envR * Math.sqrt(Math.random());
            p.tx = Math.cos(p.orbitTheta) * r;
            p.ty = bowlY - f * (torchH * 0.44);
            p.tz = Math.sin(p.orbitTheta) * r;

            const rnd = Math.random();
            p.targetSpriteIdx = isSpark ? 5 : (rnd < 0.35 ? 6 : (rnd < 0.68 ? 1 : (rnd < 0.88 ? 5 : 2)));
            p.targetSize = isSpark ? 1.5 : (1.4 + Math.random() * 2.0);
            p.targetAlpha = 0.88;
          }
        }
      }

      // 第 3 幕：群山流水
      else if (stageIndex === 2) {
        targetRotY = 0;
        targetRotX = 0.22;
        targetZoom = 1.0;

        const spanW = Math.min(width * 0.78, 920);
        const spanH = Math.min(height * 0.50, 400);

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const p = particles[i];
          if (i < 4500) {
            p.role = 'static';
            const layer = i % 5;
            const layerZ = -200 + layer * 85;
            const lx = (Math.random() - 0.5) * spanW * (1.15 - layer * 0.06);
            const normX = lx / (spanW * 0.5);

            const valleyDip = 1 - Math.exp(-Math.pow(normX * 2.8, 2)) * 0.82;
            const ridgeWave = Math.abs(
              Math.sin(normX * 3.1 + layer * 1.4) * 0.55 +
              Math.cos(normX * 6.4 - layer * 0.8) * 0.3 +
              Math.sin(normX * 12.2 + layer) * 0.15
            );
            const maxPeakH = spanH * (0.62 - layer * 0.06);
            const ridgeTopY = spanH * 0.22 - ridgeWave * valleyDip * maxPeakH - (4 - layer) * 26;

            const onRidge = Math.random() < 0.58;
            const depthDrop = onRidge ? (Math.random() * 10) : (Math.random() * (spanH * 0.35 - ridgeTopY * 0.3));
            const finalY = Math.min(spanH * 0.28, ridgeTopY + Math.max(0, depthDrop));

            p.tx = lx;
            p.ty = finalY;
            p.tz = layerZ + (Math.random() - 0.5) * 16;

            p.targetSpriteIdx = onRidge ? (layer < 2 ? 4 : 0) : (layer < 2 ? 2 : 1);
            p.targetSize = onRidge ? (1.4 + Math.random() * 1.2) : (1.1 + Math.random() * 1.1);
            p.targetAlpha = onRidge ? 0.92 : (0.35 + Math.random() * 0.35);
          } else {
            p.role = 'river';
            p.flowT = Math.random();
            p.flowSpeed = 0.0028 + Math.random() * 0.0032;
            p.flowOffset = Math.random() - 0.5;

            const t = p.flowT;
            const riverW = (18 + t * 95) * (spanW / 800);
            const centerX = Math.sin(t * Math.PI * 2.1) * (spanW * 0.09) * (0.3 + t);
            p.tx = centerX + p.flowOffset * riverW;
            p.ty = spanH * 0.22 + t * 72 + Math.sin(t * 25 + p.flowOffset * 6) * 2.5;
            p.tz = -210 + t * 440;

            const r = Math.random();
            p.targetSpriteIdx = r < 0.42 ? 7 : (r < 0.72 ? 4 : (r < 0.9 ? 1 : 0));
            p.targetSize = 1.2 + Math.random() * 1.4;
            p.targetAlpha = 0.65 + Math.random() * 0.35;
          }
        }
      }

      // 第 4 幕：河北省 & 江西省地图 + 下方粒子文字 + 河北飞向江西的星光弧线
      else if (stageIndex === 3) {
        targetRotY = 0;
        targetRotX = 0.03;
        targetZoom = 1.0;

        const geo = ensureGeoCache();
        const isNarrow = width < 780;
        const mapScale = isNarrow ? Math.min(width * 0.23, 125) : Math.min(width * 0.142, height * 0.21, 160);
        const offsetX = isNarrow ? width * 0.24 : Math.min(width * 0.21, 245);
        // 地图整体略上移，底部给字幕留足呼吸空间
        const mapY = -height * 0.09;
        const textY = mapY + mapScale + (isNarrow ? 40 : 54);
        const textScale = isNarrow ? 0.54 : 0.78;

        let idx = 0;

        // 河北轮廓
        for (let k = 0; k < geo.hbOutline.length && idx < PARTICLE_COUNT; k++, idx++) {
          const p = particles[idx];
          p.role = 'static';
          p.tx = -offsetX + geo.hbOutline[k][0] * mapScale;
          p.ty = mapY + geo.hbOutline[k][1] * mapScale;
          p.tz = (Math.random() - 0.5) * 6;
          p.targetSpriteIdx = k % 5 === 0 ? 4 : 0;
          p.targetSize = 1.7;
          p.targetAlpha = 0.95;
        }
        // 河北填充
        for (let k = 0; k < geo.hbFill.length && idx < PARTICLE_COUNT; k++, idx++) {
          const p = particles[idx];
          p.role = 'static';
          p.tx = -offsetX + geo.hbFill[k][0] * mapScale;
          p.ty = mapY + geo.hbFill[k][1] * mapScale;
          p.tz = (Math.random() - 0.5) * 14;
          p.targetSpriteIdx = Math.random() < 0.7 ? 2 : 0;
          p.targetSize = 1.2 + Math.random() * 1.0;
          p.targetAlpha = 0.45 + Math.random() * 0.35;
        }
        // 江西轮廓
        for (let k = 0; k < geo.jxOutline.length && idx < PARTICLE_COUNT; k++, idx++) {
          const p = particles[idx];
          p.role = 'static';
          p.tx = offsetX + geo.jxOutline[k][0] * mapScale;
          p.ty = mapY + geo.jxOutline[k][1] * mapScale;
          p.tz = (Math.random() - 0.5) * 6;
          p.targetSpriteIdx = k % 5 === 0 ? 4 : 1;
          p.targetSize = 1.7;
          p.targetAlpha = 0.95;
        }
        // 江西填充
        for (let k = 0; k < geo.jxFill.length && idx < PARTICLE_COUNT; k++, idx++) {
          const p = particles[idx];
          p.role = 'static';
          p.tx = offsetX + geo.jxFill[k][0] * mapScale;
          p.ty = mapY + geo.jxFill[k][1] * mapScale;
          p.tz = (Math.random() - 0.5) * 14;
          p.targetSpriteIdx = Math.random() < 0.7 ? 3 : 1;
          p.targetSize = 1.2 + Math.random() * 1.0;
          p.targetAlpha = 0.45 + Math.random() * 0.35;
        }
        // 粒子文字“河北”
        for (let k = 0; k < geo.hbText.length && idx < PARTICLE_COUNT; k++, idx++) {
          const p = particles[idx];
          p.role = 'static';
          p.tx = -offsetX + geo.hbText[k][0] * textScale;
          p.ty = textY + geo.hbText[k][1] * textScale;
          p.tz = 0;
          p.targetSpriteIdx = k % 3 === 0 ? 4 : 0;
          p.targetSize = 1.55;
          p.targetAlpha = 0.96;
        }
        // 粒子文字“江西”
        for (let k = 0; k < geo.jxText.length && idx < PARTICLE_COUNT; k++, idx++) {
          const p = particles[idx];
          p.role = 'static';
          p.tx = offsetX + geo.jxText[k][0] * textScale;
          p.ty = textY + geo.jxText[k][1] * textScale;
          p.tz = 0;
          p.targetSpriteIdx = k % 3 === 0 ? 4 : 1;
          p.targetSize = 1.55;
          p.targetAlpha = 0.96;
        }
        // 从河北（左）飞向江西（右）的星光连线弧线
        for (let k = 0; k < 420 && idx < PARTICLE_COUNT; k++, idx++) {
          const p = particles[idx];
          p.role = 'arc';
          p.flowT = k / 420;
          p.flowSpeed = 0.0045;
          p.arcHalfW = offsetX * 0.52;
          p.arcBaseY = mapY;
          p.arcLift = mapScale * 0.58;
          const t = p.flowT;
          p.tx = -p.arcHalfW + (p.arcHalfW * 2) * t;
          p.ty = p.arcBaseY - Math.sin(t * Math.PI) * p.arcLift;
          p.tz = Math.sin(t * Math.PI) * 35;
          p.targetSpriteIdx = k % 2 === 0 ? 5 : 4;
          p.targetSize = 1.55;
          p.targetAlpha = 0.88;
        }
        // 背景微星
        for (; idx < PARTICLE_COUNT; idx++) {
          const p = particles[idx];
          p.role = 'static';
          p.tx = (Math.random() - 0.5) * width * 1.1;
          p.ty = (Math.random() - 0.5) * height * 1.1;
          p.tz = -120 - Math.random() * 260;
          p.targetSpriteIdx = 4;
          p.targetSize = 1.1;
          p.targetAlpha = 0.25 + Math.random() * 0.3;
        }
      }

      // 第 5 幕：终幕放大版宏伟紫粉色 3D 圣诞树
      else if (stageIndex === 4) {
        targetRotX = 0.16;
        targetZoom = 1.0;

        const treeH = Math.min(height * 0.78, 680);
        const maxR = Math.min(width * 0.26, 265);
        const tiers = 9;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const p = particles[i];
          if (i < 5000) {
            p.role = 'orbit';
            const t = Math.random();
            const tierPos = (t * tiers) % 1;
            const overallCone = Math.pow(t, 0.87);
            const branchFlare = 0.36 + 0.64 * Math.pow(tierPos, 0.65);
            const rMax = maxR * overallCone * branchFlare;

            const radialBias = Math.random() < 0.8 ? (0.68 + 0.32 * Math.random()) : Math.random() * 0.68;
            const r = rMax * radialBias;
            const droop = Math.pow(r / (maxR + 1), 1.45) * 18;
            const y = -treeH * 0.5 + t * treeH + droop;
            const theta = Math.random() * Math.PI * 2;

            p.orbitR = r;
            p.orbitTheta = theta;
            p.orbitSpeed = 0.0018 + (1 - t) * 0.0012;
            p.baseY = y;
            p.tx = Math.cos(theta) * r;
            p.ty = y;
            p.tz = Math.sin(theta) * r;

            const rnd = Math.random();
            const isBulb = rnd > 0.972;
            p.targetSpriteIdx = rnd < 0.36 ? 0 : (rnd < 0.68 ? 1 : (rnd < 0.84 ? 2 : (rnd < 0.94 ? 3 : (rnd < 0.982 ? 4 : 5))));
            p.targetSize = isBulb ? (3.0 + Math.random() * 1.4) : (1.0 + Math.random() * 1.35);
            p.targetAlpha = isBulb ? 0.96 : (0.38 + Math.random() * 0.54);
          } else if (i < 6500) {
            p.role = 'orbit';
            const k = i - 5000;
            const t = k / 1500;
            const r = maxR * Math.pow(t, 0.87) * 1.035 + (Math.random() - 0.5) * 5;
            const y = -treeH * 0.5 + t * treeH + (Math.random() - 0.5) * 4;
            const strand = k % 2;
            const theta = t * Math.PI * 2 * 8.0 + strand * Math.PI + (Math.random() - 0.5) * 0.05;

            p.orbitR = r;
            p.orbitTheta = theta;
            p.orbitSpeed = 0.011;
            p.baseY = y;
            p.tx = Math.cos(theta) * r;
            p.ty = y;
            p.tz = Math.sin(theta) * r;

            p.targetSpriteIdx = strand === 0 ? 1 : 4;
            p.targetSize = 1.3 + Math.random() * 1.25;
            p.targetAlpha = 0.82;
          } else {
            p.role = 'orbit';
            const k = i - 6500;
            const t = Math.random();
            const r = maxR * (0.25 + Math.pow(t, 0.85) * 1.42);
            const arm = k % 3;
            const theta = (t * Math.PI * 4.5) + (arm * Math.PI * 2 / 3) + (Math.random() - 0.5) * 0.5;
            const y = treeH * 0.5 + 18 + (Math.random() - 0.5) * 5;

            p.orbitR = r;
            p.orbitTheta = theta;
            p.orbitSpeed = 0.008 / (0.35 + t);
            p.baseY = y;
            p.tx = Math.cos(theta) * r;
            p.ty = y;
            p.tz = Math.sin(theta) * r;

            p.targetSpriteIdx = k % 4;
            p.targetSize = 0.95 + Math.random() * 1.25;
            p.targetAlpha = (1 - t * 0.7) * 0.68;
          }
        }
      }
    }

    // -------------------------------------------------------------
    // 5. 背景细雪、流星、交互烟花与终幕锐利顶星
    // -------------------------------------------------------------
    const snowParticles = [];
    const fireworks = [];
    const shootingStars = [];

    function initAmbient() {
      snowParticles.length = 0;
      for (let i = 0; i < 120; i++) {
        snowParticles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: 0.9 + Math.random() * 1.4,
          vy: 0.35 + Math.random() * 0.85,
          vx: (Math.random() - 0.5) * 0.35,
          swing: Math.random() * Math.PI * 2,
          alpha: 0.15 + Math.random() * 0.35
        });
      }
    }

    function spawnFirework(x, y) {
      const spriteIdx = Math.floor(Math.random() * 5);
      for (let i = 0; i < 42; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.2 + Math.random() * 4.5;
        fireworks.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 1.4 + Math.random() * 2.0,
          alpha: 1,
          decay: 0.015 + Math.random() * 0.02,
          spriteIdx
        });
      }
    }

    function drawTopStar(cx, cy, scale, time, alphaFactor) {
      if (alphaFactor <= 0.01) return;
      ctx.save();
      ctx.translate(cx, cy);

      const haloSize = 48 * scale * (1 + Math.sin(time * 0.05) * 0.08);
      ctx.globalAlpha = 0.44 * alphaFactor;
      ctx.drawImage(sprites[4], -haloSize / 2, -haloSize / 2, haloSize, haloSize);

      ctx.save();
      ctx.rotate(time * 0.012);
      ctx.globalAlpha = 0.88 * alphaFactor;
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 2; i++) {
        ctx.rotate(Math.PI / 2);
        ctx.beginPath();
        ctx.ellipse(0, 0, 30 * scale, 1.2 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.rotate(Math.PI / 4);
      ctx.globalAlpha = 0.45 * alphaFactor;
      for (let i = 0; i < 2; i++) {
        ctx.rotate(Math.PI / 2);
        ctx.beginPath();
        ctx.ellipse(0, 0, 16 * scale, 0.85 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      ctx.globalAlpha = 0.98 * alphaFactor;
      ctx.beginPath();
      const outerR = 13.5 * scale;
      const innerR = 5.4 * scale;
      let rot = -Math.PI / 2;
      for (let i = 0; i < 5; i++) {
        ctx.lineTo(Math.cos(rot) * outerR, Math.sin(rot) * outerR);
        rot += Math.PI / 5;
        ctx.lineTo(Math.cos(rot) * innerR, Math.sin(rot) * innerR);
        rot += Math.PI / 5;
      }
      ctx.closePath();
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.restore();
    }

    // -------------------------------------------------------------
    // 6. 主循环
    // -------------------------------------------------------------
    let lastTime = performance.now();
    let frameCount = 0;
    let treeStarAlpha = 0;

    function animate(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      frameCount++;

      stageElapsed += dt;
      if (scatterTimer > 0) scatterTimer = Math.max(0, scatterTimer - dt);
      if (currentStage < 4 && stageElapsed >= STAGE_DURATIONS[currentStage]) {
        configureStage(currentStage + 1, true);
      }

      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(6, 2, 13, 0.62)';
      ctx.fillRect(0, 0, width, height);

      ctx.globalCompositeOperation = 'lighter';

      if (!isDragging) {
        if (currentStage === 0) targetRotY += 0.0012;
        else if (currentStage === 1) targetRotY += 0.004;
        else if (currentStage === 2) targetRotY = Math.sin(frameCount * 0.008) * 0.14;
        else if (currentStage === 3) targetRotY = Math.sin(frameCount * 0.01) * 0.06;
        else if (currentStage === 4) targetRotY += 0.0045;
      }

      rotY += (targetRotY - rotY) * 0.07;
      rotX += (targetRotX - rotX) * 0.07;
      zoom += (targetZoom - zoom) * 0.08;

      const cosY = Math.cos(rotY);
      const sinY = Math.sin(rotY);
      const cosX = Math.cos(rotX);
      const sinX = Math.sin(rotX);

      const fov = 780;
      const originX = (currentStage === 4 && width > 900) ? width * 0.55 : width * 0.5;
      const originY = (currentStage === 4 && width > 900) ? height * 0.50 : height * 0.52;

      // 细雪
      for (let i = 0; i < snowParticles.length; i++) {
        const s = snowParticles[i];
        s.swing += 0.02;
        s.y += s.vy;
        s.x += s.vx + Math.sin(s.swing) * 0.3;
        if (s.y > height + 10) { s.y = -10; s.x = Math.random() * width; }
        ctx.globalAlpha = s.alpha;
        const sz = s.size;
        ctx.drawImage(sprites[4], s.x - sz, s.y - sz, sz * 2, sz * 2);
      }

      // 流星
      if (Math.random() < 0.005 && shootingStars.length < 2) {
        shootingStars.push({
          x: Math.random() * width * 0.75 + width * 0.15,
          y: Math.random() * height * 0.22,
          vx: -7 - Math.random() * 4,
          vy: 3 + Math.random() * 2,
          alpha: 0.9
        });
      }
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const st = shootingStars[i];
        st.x += st.vx;
        st.y += st.vy;
        st.alpha -= 0.022;
        if (st.alpha <= 0) { shootingStars.splice(i, 1); continue; }
        const grad = ctx.createLinearGradient(st.x, st.y, st.x - st.vx * 6, st.y - st.vy * 6);
        grad.addColorStop(0, `rgba(255, 240, 252, ${st.alpha})`);
        grad.addColorStop(1, 'rgba(216, 180, 254, 0)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(st.x, st.y);
        ctx.lineTo(st.x - st.vx * 6, st.y - st.vy * 6);
        ctx.stroke();
      }

      const isScattering = scatterTimer > 0;
      const spanW = Math.min(width * 0.78, 920);
      const spanH = Math.min(height * 0.50, 400);
      const torchH = Math.min(height * 0.64, 540);

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = particles[i];

        if (isScattering) {
          p.x += p.vx;
          p.y += p.vy;
          p.z += p.vz;
          p.vx *= 0.94;
          p.vy *= 0.94;
          p.vz *= 0.94;
        } else {
          if (p.role === 'star' || p.role === 'orbit') {
            p.orbitTheta += p.orbitSpeed;
            p.tx = Math.cos(p.orbitTheta) * p.orbitR;
            p.ty = p.baseY;
            p.tz = Math.sin(p.orbitTheta) * p.orbitR;
          } else if (p.role === 'flame') {
            p.flamePhase += p.flameSpeed;
            if (p.flamePhase >= 1) p.flamePhase -= 1;
            const f = p.flamePhase;
            const isSpark = p.seed === 1;
            const maxH = isSpark ? torchH * 0.56 : torchH * 0.43;
            const envR = isSpark
              ? (0.2 + f * 1.1) * p.flameMaxR
              : Math.sin(f * Math.PI) * (1 - f * 0.58) * p.flameMaxR;
            const r = envR * (0.35 + 0.65 * Math.sin(p.flameSeedX + f * 5));
            const swayX = Math.sin(frameCount * 0.08 + f * 5.0 + p.flameSeedX) * (14 * f);
            const swayZ = Math.cos(frameCount * 0.07 + f * 4.5 + p.flameSeedX) * (10 * f);
            p.tx = Math.cos(p.orbitTheta) * r + swayX;
            p.ty = p.flameBaseY - f * maxH;
            p.tz = Math.sin(p.orbitTheta) * r + swayZ;
          } else if (p.role === 'river') {
            p.flowT += p.flowSpeed;
            if (p.flowT >= 1) {
              p.flowT -= 1;
              const t0 = p.flowT;
              const rw0 = (18 + t0 * 95) * (spanW / 800);
              const cx0 = Math.sin(t0 * Math.PI * 2.1) * (spanW * 0.09) * (0.3 + t0);
              p.x = cx0 + p.flowOffset * rw0;
              p.y = spanH * 0.22 + t0 * 72;
              p.z = -210 + t0 * 440;
            }
            const t = p.flowT;
            const riverW = (18 + t * 95) * (spanW / 800);
            const centerX = Math.sin(t * Math.PI * 2.1) * (spanW * 0.09) * (0.3 + t);
            p.tx = centerX + p.flowOffset * riverW;
            p.ty = spanH * 0.22 + t * 72 + Math.sin(frameCount * 0.1 + t * 24 + p.flowOffset * 6) * 2.5;
            p.tz = -210 + t * 440;
          } else if (p.role === 'arc') {
            // 星光粒子从河北（左侧）飞向江西（右侧）
            p.flowT += p.flowSpeed;
            if (p.flowT >= 1) {
              p.flowT -= 1;
              p.x = -p.arcHalfW;
              p.y = p.arcBaseY;
              p.z = 0;
            }
            const t = p.flowT;
            p.tx = -p.arcHalfW + (p.arcHalfW * 2) * t;
            p.ty = p.arcBaseY - Math.sin(t * Math.PI) * p.arcLift;
            p.tz = Math.sin(t * Math.PI) * 35;
          }

          p.x += (p.tx - p.x) * 0.085;
          p.y += (p.ty - p.y) * 0.085;
          p.z += (p.tz - p.z) * 0.085;
        }

        p.size += (p.targetSize - p.size) * 0.08;
        p.alpha += (p.targetAlpha - p.alpha) * 0.08;
        if (Math.abs(p.x - p.tx) < 80) p.spriteIdx = p.targetSpriteIdx;

        const x1 = p.x * cosY - p.z * sinY;
        const z1 = p.z * cosY + p.x * sinY;
        const y2 = p.y * cosX - z1 * sinX;
        const z2 = z1 * cosX + p.y * sinX;

        const scale = (fov / (fov + z2)) * zoom;
        if (scale <= 0.05) continue;

        const sx = originX + x1 * scale;
        const sy = originY + y2 * scale;
        if (sx < -40 || sx > width + 40 || sy < -40 || sy > height + 40) continue;

        const twinkle = 0.65 + 0.35 * Math.sin(frameCount * p.twinkleSpeed + p.phase);
        const depthFade = Math.max(0.22, Math.min(1.0, (fov - z2 * 0.55) / fov));

        let flameFade = 1;
        if (p.role === 'flame' && !isScattering) {
          flameFade = Math.sin(p.flamePhase * Math.PI);
        }

        ctx.globalAlpha = p.alpha * twinkle * depthFade * flameFade;
        const sz = p.size * scale;
        ctx.drawImage(sprites[p.spriteIdx], sx - sz, sy - sz, sz * 2, sz * 2);
      }

      const targetStarAlpha = (currentStage === 4 && !isScattering) ? 1 : 0;
      treeStarAlpha += (targetStarAlpha - treeStarAlpha) * 0.06;
      if (treeStarAlpha > 0.01) {
        const treeH = Math.min(height * 0.78, 680);
        const topY = -treeH * 0.5 - 12;
        const starY2 = topY * cosX;
        const starZ2 = topY * sinX;
        const starScale = (fov / (fov + starZ2)) * zoom;
        drawTopStar(originX, originY + starY2 * starScale, starScale, frameCount, treeStarAlpha);
      }

      for (let i = fireworks.length - 1; i >= 0; i--) {
        const fw = fireworks[i];
        fw.x += fw.vx;
        fw.y += fw.vy;
        fw.vy += 0.07;
        fw.vx *= 0.96;
        fw.vy *= 0.96;
        fw.alpha -= fw.decay;
        if (fw.alpha <= 0) { fireworks.splice(i, 1); continue; }
        ctx.globalAlpha = fw.alpha;
        const sz = fw.size;
        ctx.drawImage(sprites[fw.spriteIdx], fw.x - sz, fw.y - sz, sz * 2, sz * 2);
      }

      requestAnimationFrame(animate);
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      initAmbient();
      configureStage(currentStage, false);
    }

    window.addEventListener('resize', resize);
    resize();
    configureStage(0, false);
    requestAnimationFrame(animate);

    // -------------------------------------------------------------
    // 7. 交互控制
    // -------------------------------------------------------------
    stageDots.forEach((dot) => {
      dot.addEventListener('click', (e) => {
        e.stopPropagation();
        const s = parseInt(dot.getAttribute('data-stage'), 10);
        configureStage(s, true);
      });
    });

    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('.hud-controls')) return;
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      spawnFirework(e.clientX, e.clientY);
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      targetRotY += (e.clientX - lastX) * 0.008;
      targetRotX = Math.max(-0.25, Math.min(0.6, targetRotX + (e.clientY - lastY) * 0.005));
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('.hud-controls')) return;
      isDragging = true;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
      spawnFirework(lastX, lastY);
    });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const t = e.touches[0];
      targetRotY += (t.clientX - lastX) * 0.008;
      targetRotX = Math.max(-0.25, Math.min(0.6, targetRotX + (t.clientY - lastY) * 0.005));
      lastX = t.clientX;
      lastY = t.clientY;
    });

    window.addEventListener('touchend', () => { isDragging = false; });

    window.addEventListener('wheel', (e) => {
      targetZoom = Math.max(0.6, Math.min(1.65, targetZoom - e.deltaY * 0.001));
    }, { passive: true });

    // -------------------------------------------------------------
    // 8. 水晶八音盒音乐
    // -------------------------------------------------------------
    let audioCtx = null;
    let isPlaying = false;
    let musicTimer = null;

    const melody = [
      { n: 'D4', d: 0.38 }, { n: 'G4', d: 0.38 }, { n: 'G4', d: 0.19 }, { n: 'A4', d: 0.19 },
      { n: 'G4', d: 0.19 }, { n: 'F#4', d: 0.19 }, { n: 'E4', d: 0.38 }, { n: 'E4', d: 0.38 },
      { n: 'E4', d: 0.38 }, { n: 'A4', d: 0.38 }, { n: 'A4', d: 0.19 }, { n: 'B4', d: 0.19 },
      { n: 'A4', d: 0.19 }, { n: 'G4', d: 0.19 }, { n: 'F#4', d: 0.38 }, { n: 'D4', d: 0.38 },
      { n: 'D4', d: 0.38 }, { n: 'B4', d: 0.38 }, { n: 'B4', d: 0.19 }, { n: 'C5', d: 0.19 },
      { n: 'B4', d: 0.19 }, { n: 'A4', d: 0.19 }, { n: 'G4', d: 0.38 }, { n: 'E4', d: 0.38 },
      { n: 'D4', d: 0.19 }, { n: 'D4', d: 0.19 }, { n: 'E4', d: 0.38 }, { n: 'A4', d: 0.38 },
      { n: 'F#4', d: 0.38 }, { n: 'G4', d: 0.76 }
    ];

    const freqs = {
      'D4': 293.66, 'E4': 329.63, 'F#4': 369.99, 'G4': 392.00,
      'A4': 440.00, 'B4': 493.88, 'C5': 523.25
    };

    function playNote(freq, dur) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur * 2.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + dur * 2.2);
    }

    let noteIdx = 0;
    function loopMusic() {
      if (!isPlaying) return;
      const m = melody[noteIdx];
      playNote(freqs[m.n] || 440, m.d);
      noteIdx = (noteIdx + 1) % melody.length;
      musicTimer = setTimeout(loopMusic, m.d * 1000 + 30);
    }

    const musicBtn = document.getElementById('musicBtn');
    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      isPlaying = !isPlaying;
      if (isPlaying) {
        musicBtn.classList.add('active');
        loopMusic();
      } else {
        musicBtn.classList.remove('active');
        clearTimeout(musicTimer);
      }
    });
  </script>
</body>
</html>
